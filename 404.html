<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>ページは存在しません — Pooのくそさいと</title>
    <meta name="description" content="ページは存在しません。">
    <meta name="theme-color" content="#dc6969">
    <meta name="robots" content="noindex, follow">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Yomogi&family=Zen+Kurenaido&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
    <link rel="icon" href="/photo/favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="/photo/icon.png">

    <script>
        // トップと おなじ あかるさで ひらく
        (function () {
            var dark = false;
            try {
                var s = localStorage.getItem('poo-theme');
                dark = s ? s === 'dark' : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
            } catch (e) {}
            document.documentElement.className = dark ? 'pre-dark' : 'pre-light';
        })();
    </script>
    <style>
        html.pre-dark body { background-color: #070b1c; }
    </style>
</head>
<body class="light-mode">

    <div class="grain" aria-hidden="true"></div>
    <div id="fireflies" aria-hidden="true"></div>

    <div class="page nf-page">

        <div class="nf-paper">
            <span class="tape tape-tc" aria-hidden="true"></span>
            <div class="nf-inner">
                <p class="nf-num" aria-hidden="true">404<svg class="nf-scratch" viewBox="0 0 220 14" preserveAspectRatio="none"><path d="M4 9 Q 60 2 118 8 T 216 5"/></svg></p>
                <h1 class="nf-title">ページは存在しません</h1>
                <p class="nf-lead">
                    もともと なにもないサイトですが、<br>
                    ここは とくに なにもありません。
                </p>
                <a class="nf-back" href="/">トップへ もどる <i class="fa-solid fa-arrow-right" aria-hidden="true"></i></a>
            </div>
        </div>

        <p class="nf-sign">poo.pptx</p>

    </div>

    <script>
        (function () {
            var dark = document.documentElement.className === 'pre-dark';
            document.body.classList.toggle('dark-mode', dark);
            document.body.classList.toggle('light-mode', !dark);

            var calm = window.matchMedia
                && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            var box = document.getElementById('fireflies');
            if (!dark || calm || !box) return;

            function rnd(a, b) { return a + Math.random() * (b - a); }

            var n = window.innerWidth < 720 ? 8 : 13;
            for (var i = 0; i < n; i++) {
                var el = document.createElement('i');
                el.className = 'ff';
                el.style.left = rnd(2, 96).toFixed(1) + 'vw';
                el.style.top  = rnd(6, 92).toFixed(1) + 'vh';
                el.style.setProperty('--r',  rnd(2.6, 5).toFixed(1) + 'px');
                el.style.setProperty('--dx', rnd(-90, 90).toFixed(0) + 'px');
                el.style.setProperty('--dy', rnd(-120, 40).toFixed(0) + 'px');
                el.style.setProperty('--d',  rnd(16, 30).toFixed(1) + 's');
                el.style.setProperty('--b',  rnd(2.6, 5.4).toFixed(1) + 's');
                el.style.setProperty('--dd', (-rnd(0, 20)).toFixed(1) + 's');
                el.style.setProperty('--bd', (-rnd(0, 6)).toFixed(1) + 's');
                box.appendChild(el);
            }
        })();
    </script>
</body>
</html>
