<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>poo123 — プロフィール</title>
<meta name="description" content="Pooのくそさいと を Instagram のプロフィールとして再構成したページ。">
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex, follow">
<link rel="icon" href="/photo/favicon.ico" type="image/x-icon">
<style>
:root{
  --bg:#fff; --ink:#0f1419; --ink2:#737373; --line:#dbdbdb; --soft:#efefef;
  --blue:#0095f6; --ok:#2ecc71; --warn:#f1c40f; --dnd:#e74c3c; --off:#a8a8a8;
  --ring:linear-gradient(45deg,#f9ce34,#ee2a7b,#6228d7);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#000; --ink:#f5f5f5; --ink2:#a8a8a8; --line:#262626; --soft:#1a1a1a; }
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg);color:var(--ink);min-height:100svh;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
  font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;
  padding-bottom:70px;
}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer}
.ic{width:1em;height:1em;display:inline-block;vertical-align:-.13em;flex:none}

/* ===== ヘッダー ===== */
.top{
  position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;
  height:52px;padding:0 16px;background:var(--bg);border-bottom:1px solid var(--line);
}
.brand{font-size:23px;font-weight:600;letter-spacing:.02em;
  font-family:"Snell Roundhand","Segoe Script","Brush Script MT",cursive}
.top .right{margin-left:auto;display:flex;gap:18px;font-size:22px;color:var(--ink)}

.page{max-width:935px;margin:0 auto;padding:22px 16px 0}

/* ===== プロフィール ===== */
.prof{display:flex;gap:28px;align-items:flex-start;margin-bottom:28px}
.face-wrap{position:relative;flex:none}
.face{width:142px;height:142px;border-radius:50%;padding:4px;background:var(--ring);display:block}
.face span{display:block;width:100%;height:100%;border-radius:50%;overflow:hidden;
  border:3px solid var(--bg);background:#333}
.face img{width:100%;height:100%;object-fit:cover;display:block}
.pdot{position:absolute;right:8px;bottom:8px;width:20px;height:20px;border-radius:50%;
  background:var(--off);border:3px solid var(--bg)}
.pdot.online{background:var(--ok)}.pdot.idle{background:var(--warn)}
.pdot.dnd{background:var(--dnd)}.pdot.offline{background:var(--off)}
.note{
  position:absolute;left:50%;top:-18px;transform:translateX(-46%);
  background:var(--soft);border-radius:16px;padding:6px 13px;font-size:11.5px;line-height:1.4;
  max-width:200px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.12);z-index:2;
}
.note::after{content:"";position:absolute;left:22px;bottom:-5px;width:9px;height:9px;border-radius:50%;background:var(--soft)}
.note::before{content:"";position:absolute;left:16px;bottom:-11px;width:5px;height:5px;border-radius:50%;background:var(--soft)}

.pbody{flex:1;min-width:0;padding-top:6px}
.prow1{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.uname{font-size:20px;font-weight:400}
.btn{border:none;border-radius:8px;padding:7px 17px;font-size:13.5px;font-weight:600;
  background:var(--blue);color:#fff}
.btn.sub{background:var(--soft);color:var(--ink)}
.btn.icn{background:var(--soft);color:var(--ink);padding:8px 11px;display:flex;align-items:center}
.stats{display:flex;gap:34px;margin-bottom:16px;font-size:15px}
.stats b{font-weight:600}
.stats span{color:var(--ink2)}
.bio b{display:block;font-weight:600;margin-bottom:2px}
.bio p{white-space:pre-line}
.bio .meta{display:flex;gap:16px;flex-wrap:wrap;color:var(--ink2);font-size:13.5px;margin-top:4px}
.bio .meta span{display:inline-flex;align-items:center;gap:6px}
.bio .site{color:#00376b;font-weight:500;display:inline-flex;align-items:center;gap:6px;margin-top:5px}
@media (prefers-color-scheme: dark){ .bio .site{color:#e0f1ff} }

/* ===== ハイライト ===== */
.hl{display:flex;gap:24px;overflow-x:auto;padding:10px 0 24px;border-bottom:1px solid var(--line)}
.hl button{background:none;border:none;color:inherit;display:flex;flex-direction:column;
  align-items:center;gap:8px;flex:none;width:92px}
.hl i{width:76px;height:76px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:27px;font-style:normal;background:var(--soft);border:1px solid var(--line);
  transition:transform .2s;color:var(--ink)}
.hl button:hover i{transform:scale(1.05)}
.hl b{font-size:12px;font-weight:400;text-align:center;line-height:1.35}

/* ===== アクティビティ ===== */
.live-wrap{padding:18px 0 4px}
.live-head{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--ink2);margin-bottom:10px}
.live{transition:height .42s cubic-bezier(.22,1,.36,1)}
.live.moving{overflow:hidden}
.lrow{display:flex;gap:12px;align-items:center;padding:9px 0;
  transition:opacity .3s,transform .34s cubic-bezier(.22,1,.36,1)}
.lrow.in{opacity:0;transform:translateY(10px)}
.lrow.out{position:absolute;left:0;right:0;opacity:0;transform:translateY(-8px);pointer-events:none}
.lico{width:54px;height:54px;flex:none;border-radius:50%;overflow:hidden;background:var(--soft);
  display:flex;align-items:center;justify-content:center;font-size:21px;color:var(--ink2)}
.lico img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
.lb{flex:1;min-width:0}
.lb b{display:block;font-size:13.5px;font-weight:600;word-break:break-word}
.lb span{display:block;font-size:12.5px;color:var(--ink2);word-break:break-word}
.bar{height:3px;border-radius:2px;background:var(--soft);margin-top:7px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ink);transition:width 1s linear}
.times{display:flex;justify-content:space-between;font-size:11px;color:var(--ink2);margin-top:3px;font-variant-numeric:tabular-nums}

/* ===== タブ ===== */
.tabs{display:flex;justify-content:center;gap:58px;border-top:1px solid var(--line);margin-top:20px}
.tabs span{padding:16px 0;font-size:12px;letter-spacing:.1em;font-weight:600;color:var(--ink2);
  display:flex;align-items:center;gap:8px;border-top:1px solid transparent;margin-top:-1px}
.tabs span.on{color:var(--ink);border-top-color:var(--ink)}

/* ===== グリッド ===== */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px 0 30px}
.cell{position:relative;aspect-ratio:1/1;overflow:hidden;background:var(--soft);
  border:none;padding:0;display:block;color:#fff}
.cell img{width:100%;height:100%;object-fit:cover;display:block}
.cell .txt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:9px;padding:16px;text-align:center}
.cell .txt .ic{font-size:30px}
.cell .txt b{font-size:14px;font-weight:600;line-height:1.5}
.cell .txt small{font-size:11px;opacity:.85;line-height:1.6}
.cell .over{position:absolute;inset:0;background:rgba(0,0,0,.34);color:#fff;opacity:0;
  display:flex;align-items:center;justify-content:center;gap:24px;font-size:14px;font-weight:700;
  transition:opacity .2s}
.cell .over span{display:inline-flex;align-items:center;gap:7px}
.cell:hover .over{opacity:1}

/* ===== 詳細 ===== */
.modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.72);
  display:flex;align-items:center;justify-content:center;padding:18px;
  opacity:0;visibility:hidden;transition:opacity .22s,visibility .22s}
.modal.on{opacity:1;visibility:visible}
.sheet{background:var(--bg);border-radius:12px;max-width:540px;width:100%;
  max-height:86svh;overflow-y:auto;transform:scale(.96);transition:transform .26s cubic-bezier(.34,1.4,.64,1)}
.modal.on .sheet{transform:scale(1)}
.shead{display:flex;align-items:center;gap:11px;padding:13px 15px;border-bottom:1px solid var(--line)}
.shead .f{width:34px;height:34px;border-radius:50%;padding:2px;background:var(--ring);flex:none}
.shead .f span{display:block;width:100%;height:100%;border-radius:50%;overflow:hidden;background:#333;border:2px solid var(--bg)}
.shead .f img{width:100%;height:100%;object-fit:cover;display:block}
.shead b{font-size:13.5px;font-weight:600}
.shead button{margin-left:auto;background:none;border:none;color:var(--ink);font-size:19px;display:flex}
.sbody{padding:16px 18px 22px}
.sbody h3{font-size:16px;margin-bottom:12px}
.sbody ul{list-style:none;display:flex;flex-direction:column;gap:0}
.sbody li{display:flex;gap:14px;font-size:13.5px;border-bottom:1px solid var(--line);padding:9px 0}
.sbody li:last-child{border-bottom:none}
.sbody li b{flex:none;min-width:104px;color:var(--ink2);font-weight:400}
.sbody .chips{display:flex;flex-wrap:wrap;gap:8px}
.sbody .chip{font-size:12.5px;padding:4px 13px;border-radius:999px;background:var(--soft)}
.sbody .q{font-weight:600;font-size:13.5px;margin-top:15px}
.sbody .a{font-size:13px;color:var(--ink2)}
.sbody .lnk{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.sbody .lnk:last-child{border-bottom:none}
.sbody .lnk .bx{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;background:var(--soft);font-size:16px;flex:none}
.sbody .lnk b{font-size:13.5px;font-weight:600;display:block;min-width:0;color:inherit}
.sbody .lnk em{font-style:normal;font-size:12px;color:var(--ink2);display:block}
.sbody .lnk .go{margin-left:auto;color:var(--ink2);font-size:14px}

/* ===== 下部バー ===== */
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:40;height:52px;
  display:flex;align-items:center;justify-content:space-around;
  background:var(--bg);border-top:1px solid var(--line);font-size:23px}
.bottom .me{width:26px;height:26px;border-radius:50%;overflow:hidden;background:#333;border:1.5px solid var(--ink)}
.bottom .me img{width:100%;height:100%;object-fit:cover;display:block}

@media (max-width:735px){
  .page{padding:16px 0 0}
  .prof{padding:0 16px;gap:18px}
  .face{width:86px;height:86px;padding:3px}
  .pdot{width:15px;height:15px;right:2px;bottom:2px;border-width:2px}
  .note{max-width:158px;font-size:11px;top:-22px}
  .uname{font-size:17px}
  .stats{gap:22px;font-size:13px}
  .bio{padding:0 16px}
  .prow1{margin-bottom:12px}
  .hl{padding:14px 16px 20px;gap:18px}
  .hl button{width:74px}
  .hl i{width:62px;height:62px;font-size:23px}
  .live-wrap{padding:16px}
  .tabs{gap:40px}
  .grid{gap:2px}
  .cell .txt .ic{font-size:22px}
  .cell .txt b{font-size:12px}
  .cell .txt small{display:none}
}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms!important;transition-duration:.001ms!important}
}
</style>
</head>

        '<p class="q">アクティビティとは何ですか？</p><p class="a">管理者が起動しているかどうかです。何かを実行している場合は、その内容が表示されます。</p>'+
        '<p class="q">更新はされますか？</p><p class="a">気が向いた場合に限ります。おおむね向きません。</p>'+
        '<p class="q">連絡を取りたい場合は？</p><p class="a">下部のリンクからどうぞ。返信は期待しないでください。</p>',
    links:
        '<h3>リンク</h3>'+
        lnk('https://discord.com/users/339360580886593536','discord','Discord','poo.pptx')+
        lnk('https://x.com/_poo_main','x','X','@_poo_main')+
        lnk('https://www.instagram.com/poo._.abc/','instagram','Instagram','poo._.abc')+
        lnk('https://open.spotify.com/user/9diufth0yxkusydwr2rt1vpbb','spotify','Spotify','Poo')+
        lnk('https://github.com/poo0123','github','GitHub','poo0123')+
        lnk('https://steamcommunity.com/id/Poo0123/','steam','Steam','Poo0123')
  };

  function lnk(href, icon, name, id){
    return '<a class="lnk" href="'+href+'" target="_blank" rel="noopener">'+
      '<span class="bx">'+I(icon)+'</span>'+
      '<span><b>'+name+'</b><em>'+id+'</em></span>'+
      '<span class="go">'+I('arrowUR')+'</span></a>';
  }

  var modal = document.getElementById('modal');
  var mBody = document.getElementById('m-body');
  function open(k){ if (!SHEETS[k]) return; mBody.innerHTML = SHEETS[k]; modal.classList.add('on'); }
  function close(){ modal.classList.remove('on'); }
  document.addEventListener('click', function(e){
    var t = e.target.closest('[data-open]');
    if (t){ open(t.dataset.open); return; }
    if (e.target === modal || e.target.closest('#m-close')) close();
  });
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') close(); });

  var box = document.getElementById('acts');
  var tmr = null, hTmr = null;

  function smooth(fn){
    var a = box.offsetHeight; fn(); box.style.height=''; var b = box.offsetHeight;
    if (a === b) return;
    box.style.height = a+'px'; box.classList.add('moving'); void box.offsetHeight;
    box.style.height = b+'px';
    clearTimeout(hTmr);
    hTmr = setTimeout(function(){ box.style.height=''; box.classList.remove('moving'); }, 440);
  }
  function leave(el){
    el.style.top = el.offsetTop+'px'; el.style.height = el.offsetHeight+'px';
    el.removeAttribute('data-k'); el.classList.add('out');
    setTimeout(function(){ el.remove(); }, 380);
  }
  function inner(a){
    var bar = '';
    if (a.start && a.end && a.end > a.start){
      bar = '<div class="bar" data-s="'+a.start+'" data-e="'+a.end+'"><i></i></div>'+
            '<div class="times"><span class="t-now">0:00</span><span>'+L.mmss(a.end-a.start)+'</span></div>';
    }
    var el = a.start && !bar ? L.since(a.start) : '';
    var pic = a.img ? '<img src="'+L.esc(a.img)+'" alt="" loading="lazy">' : I('gamepad');
    return '<span class="lico">'+pic+'</span>'+
      '<span class="lb"><b>'+(a.url?'<a href="'+L.esc(a.url)+'" target="_blank" rel="noopener" style="color:var(--blue)">'+L.esc(a.name)+'</a>':L.esc(a.name))+'</b>'+
      '<span>'+L.esc(a.label)+(el?'　'+L.esc(el):'')+(a.detail?'　'+L.esc(a.detail):'')+'</span>'+bar+'</span>';
  }
  function bars(){
    if (tmr) clearInterval(tmr);
    var run = function(){
      var live = false;
      box.querySelectorAll('.bar[data-s]').forEach(function(b){
        var s=+b.dataset.s,e=+b.dataset.e,total=e-s,done=Date.now()-s;
        var f=b.querySelector('i'), n=b.parentNode.querySelector('.t-now');
        if(total>0&&f){ f.style.width=Math.min(Math.max(done/total,0)*100,100)+'%';
          if(n) n.textContent=L.mmss(Math.max(Math.min(done,total),0)); }
        if(done<total) live=true;
      });
      if(!live) clearInterval(tmr);
    };
    run(); tmr = setInterval(run, 1000);
  }

  L.subscribe(function(d){
    if (!d) return;
    ['face','m-face','bot-face'].forEach(function(id){
      var el = document.getElementById(id);
      if (el && d.avatar) el.src = d.avatar;
    });
    document.getElementById('pdot').className = 'pdot ' + d.status;
    document.getElementById('uname').textContent = d.username;
    document.getElementById('m-user').textContent = d.username;
    document.getElementById('dname').textContent = d.name + (d.guild ? '　' + d.guild.tag : '');
    document.getElementById('st-acts').textContent = d.acts.length;
    document.getElementById('live-title').textContent =
      'アクティビティ ／ ' + d.statusLabel + (d.acts.length ? '（' + d.acts.length + ' 件）' : '');
    document.getElementById('note').textContent =
      d.acts.length ? d.acts[0].label + '：' + d.acts[0].name : d.statusLabel;

    smooth(function(){
      var have={};
      box.querySelectorAll('.lrow:not(.out)').forEach(function(el){ have[el.dataset.k]=el; });
      var want={};
      d.acts.forEach(function(a){ want[a.label+'|'+a.name+'|'+a.detail]=1; });
      Object.keys(have).forEach(function(k){ if(!want[k]){ leave(have[k]); delete have[k]; } });

      if (!d.acts.length){
        if (!box.querySelector('.none')){
          var p=document.createElement('div'); p.className='lrow none';
          p.innerHTML='<span class="lico">'+I('moon')+'</span>'+
            '<span class="lb"><b>現在アクティビティはありません</b><span>また後ほどご確認ください</span></span>';
          box.appendChild(p);
        }
        return;
      }
      var none=box.querySelector('.none'); if(none) none.remove();

      var prev=null;
      d.acts.forEach(function(a){
        var k=a.label+'|'+a.name+'|'+a.detail, sig=[a.img,a.url,a.start,a.end].join('|');
        var el=have[k];
        if(el){ if(el.dataset.sig!==sig){ el.innerHTML=inner(a); el.dataset.sig=sig; } }
        else{
          el=document.createElement('div'); el.className='lrow in';
          el.dataset.k=k; el.dataset.sig=sig; el.innerHTML=inner(a);
          setTimeout(function(){ el.classList.remove('in'); },30);
        }
        if(prev) prev.after(el); else box.insertBefore(el, box.firstChild);
        prev=el;
      });
    });
    bars();
  });
})();
</script>
</body>
</html>
