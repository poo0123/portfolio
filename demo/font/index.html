<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>ふぉんと えらび（デモ）</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { display: flex; background: #efe9dd; color: #2f2823; font-family: system-ui, "Hiragino Sans", "Yu Gothic UI", Meiryo, sans-serif; }
  #pick { width: 340px; flex: 0 0 auto; height: 100%; overflow-y: auto; padding: 14px; border-right: 1px solid #d8cfbf; background: #f7f3ea; }
  #view { flex: 1; height: 100%; border: 0; background: #fff; }
  h1 { font-size: 1rem; margin: 0 0 4px; }
  .note { font-size: 0.78rem; color: #6d6156; margin: 0 0 12px; line-height: 1.6; }
  .tgt { display: flex; gap: 6px; margin-bottom: 12px; }
  .tgt button { flex: 1; padding: 8px 6px; border: 1.5px solid #c9bda9; background: #fff; border-radius: 8px; font: inherit; font-size: 0.8rem; cursor: pointer; }
  .tgt button.on { border-color: #d9534f; background: #fbe9e7; color: #b23a36; }
  .grid { display: grid; gap: 8px; }
  .f { display: block; width: 100%; text-align: left; padding: 9px 12px; border: 1.5px solid #ddd3c2; border-radius: 10px; background: #fff; cursor: pointer; color: inherit; }
  .f:hover { border-color: #c9bda9; }
  .f.on { border-color: #d9534f; box-shadow: 0 0 0 3px #f6d5d2; }
  .f small { display: block; font: 0.68rem system-ui, sans-serif; color: #8a7d70; margin-bottom: 3px; }
  .f span { display: block; font-size: 1.25rem; line-height: 1.35; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cur { position: sticky; top: -14px; margin: -14px -14px 12px; padding: 12px 14px; background: #f7f3ea; border-bottom: 1px solid #e3dacb; z-index: 1; }
  .cur b { color: #b23a36; }
  @media (max-width: 760px) {
    body { flex-direction: column-reverse; }
    #view { height: 62%; }
    #pick { width: 100%; height: 38%; border-right: 0; border-top: 1px solid #d8cfbf; }
    .grid { grid-template-columns: 1fr 1fr; }
    .f span { font-size: 1.05rem; }
  }
</style>
</head>
<body>
<aside id="pick">
  <div class="cur">
    <h1>ふぉんと えらび</h1>
    <p class="note" style="margin:0 0 8px">押すと 右の /links に すぐ 反映。いま：<b id="now">Yomogi（いまの）</b></p>
    <div class="tgt">
      <button data-t="svc" class="on">サービス名（下の Discord / Steam）</button>
      <button data-t="name">なまえ（帯の Poo）</button>
    </div>
  </div>
  <div class="grid" id="grid"></div>
</aside>
<iframe id="view" src="/links" title="りんく プレビュー"></iframe>
<script>
const FONTS = [
  ['Yomogi', 'いまの（よもぎ）'],
  ['Zen Kurenaido', 'ぜん くれないど（なまえの いまの）'],
  ['Caveat', 'てがき 筆記体'],
  ['Klee One', 'えんぴつ っぽい'],
  ['Hachi Maru Pop', 'まるもじ ぽっぷ'],
  ['Yusei Magic', 'マジックペン'],
  ['Kaisei Decol', 'ちょっと おしゃれ 明朝'],
  ['Zen Maru Gothic', 'まるゴシック'],
  ['M PLUS Rounded 1c', 'まる ふとめ'],
  ['Kosugi Maru', 'まる ほそめ'],
  ['Mochiy Pop One', 'もちっと ぽっぷ'],
  ['Potta One', 'ふで ぽってり'],
  ['RocknRoll One', 'ろっくんろーる'],
  ['Reggae One', 'れげえ'],
  ['Rampart One', 'ふちどり 立体'],
  ['Stick', 'ぼう 線'],
  ['DotGothic16', 'ドット（ゲーム風）'],
  ['Press Start 2P', 'ドット ふとめ（英字だけ）'],
  ['Silkscreen', 'ドット ほそめ（英字だけ）'],
  ['Patrick Hand', 'てがき すなお'],
  ['Gochi Hand', 'てがき らんぼう'],
  ['Indie Flower', 'てがき ゆるい'],
  ['Gaegu', 'てがき ちいさめ'],
  ['Kalam', 'てがき ペン'],
  ['Shadows Into Light', 'てがき ほそい'],
  ['Permanent Marker', 'マーカー'],
  ['Pacifico', 'ぐるぐる 筆記体'],
  ['Fredoka', 'まるっこい'],
  ['Baloo 2', 'ぷっくり'],
  ['Comfortaa', 'まるい 幾何'],
  ['Sniglet', 'まるい ふとめ'],
  ['Delius', 'こどもっぽい'],
];
const TEXT = 'DiscordXSteamGeoGuessrInstagramYouTubeSpotifyGitHubPooabcdefghijklmnopqrstuvwxyz';
const css = (fams) => 'https://fonts.googleapis.com/css2?' + fams.map(f => 'family=' + f.replace(/ /g, '+')).join('&') + '&text=' + encodeURIComponent(TEXT) + '&display=swap';

// 見本用（つかう 文字だけ 読む）
const l = document.createElement('link'); l.rel = 'stylesheet'; l.href = css(FONTS.map(f => f[0])); document.head.appendChild(l);

const grid = document.getElementById('grid'), now = document.getElementById('now'), view = document.getElementById('view');
const state = { svc: 'Yomogi', name: 'Zen Kurenaido' };
let target = 'svc';
const SEL = { svc: '.acct .sub-svc', name: '.acct .pf-name > span:first-child' };
const SIZE = { svc: '1.15rem', name: '1.45rem' };

function apply() {
  const d = view.contentDocument; if (!d || !d.head) return;
  let lk = d.getElementById('demo-font-link'), st = d.getElementById('demo-font-style');
  if (!lk) { lk = d.createElement('link'); lk.id = 'demo-font-link'; lk.rel = 'stylesheet'; d.head.appendChild(lk); }
  if (!st) { st = d.createElement('style'); st.id = 'demo-font-style'; d.head.appendChild(st); }
  lk.href = css([state.svc, state.name]);
  st.textContent =
    SEL.svc + ' { font-family: "' + state.svc + '", "Yomogi", cursive !important; font-size: ' + SIZE.svc + '; }\n' +
    SEL.name + ' { font-family: "' + state.name + '", "Zen Kurenaido", sans-serif !important; }\n' +
    '.acct.rv { opacity: 1 !important; }';
}
function mark() {
  grid.querySelectorAll('.f').forEach(b => b.classList.toggle('on', b.dataset.f === state[target]));
  const hit = FONTS.find(f => f[0] === state[target]);
  now.textContent = state[target] + (hit ? '（' + hit[1] + '）' : '');
}
FONTS.forEach(([f, label]) => {
  const b = document.createElement('button');
  b.className = 'f'; b.dataset.f = f;
  b.innerHTML = '<small></small><span></span>';
  b.querySelector('small').textContent = f + ' ・ ' + label;
  const s = b.querySelector('span'); s.style.fontFamily = '"' + f + '", sans-serif';
  s.textContent = target === 'name' ? 'Poo' : 'Discord Steam GitHub';
  b.onclick = () => { state[target] = f; mark(); apply(); };
  grid.appendChild(b);
});
document.querySelectorAll('.tgt button').forEach(b => b.onclick = () => {
  target = b.dataset.t;
  document.querySelectorAll('.tgt button').forEach(x => x.classList.toggle('on', x === b));
  grid.querySelectorAll('.f span').forEach(s => s.textContent = target === 'name' ? 'Poo' : 'Discord Steam GitHub');
  mark();
});
view.addEventListener('load', apply);
mark();
</script>
</body>
</html>
